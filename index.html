<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <span id="network-status" class="online">Online</span>
        </div>
        <div class="header-right">
            <button id="theme-toggle">🌙</button>
            <select id="lang-select">
                <option value="uk">UA</option>
                <option value="en">EN</option>
            </select>
            <button id="logout-btn" class="hidden">Вихід</button>
        </div>
    </header>

    <main class="container">
        <section id="auth-section" class="card">
            <h2 id="auth-title">Вхід / Реєстрація</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label id="label-username" for="username">Ім'я користувача</label>
                    <input type="text" id="username" required minlength="3">
                </div>
                <div class="form-group">
                    <label id="label-password" for="password">Пароль</label>
                    <input type="password" id="password" required minlength="4">
                </div>
                <div class="auth-buttons">
                    <button type="submit" id="btn-login">Увійти</button>
                    <button type="button" id="btn-register">Реєстрація</button>
                </div>
            </form>
            <p id="auth-message" class="message"></p>
        </section>

        <section id="app-section" class="card hidden">
            <h2 id="welcome-message">Вітаємо!</h2>
            
            <div class="app-grid">
                <div class="widget">
                    <h3 id="widget-notes-title">Нотатки</h3>
                    <textarea id="notes-area" placeholder="Введіть свій текст тут..."></textarea>
                    <p id="notes-status" class="status-text"></p>
                </div>

                <div class="widget">
                    <h3 id="widget-weather-title">Погода</h3>
                    <div id="weather-search-box">
                        <input type="text" id="weather-city" placeholder="Місто...">
                        <button id="weather-btn">🔍</button>
                    </div>
                    <div id="weather-info">
                        <p id="weather-placeholder">Введіть місто для пошуку</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
